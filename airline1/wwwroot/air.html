<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Reservation</title>


    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero {
            background-image: url('https://cdn.pixabay.com/photo/2015/12/23/18/32/airport-1105980_1280.jpg');
            background-size: cover;
            background-position: center;
            height: 50vh;
            color: white;
            position: relative;
        }

        .hero-content {
            position: absolute;
            top: 30%;
            left: 10%;
        }

            .hero-content h1 {
                font-size: 3em;
            }

        .booking-box {
            background-color: rgba(0, 0, 80, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            margin-top: -100px;
        }

        .destination img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .footer {
            background-color: #0a285f;
            color: white;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><img src="https://badrairlines.com/images/logo.png" alt="Logo" height="40"></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="flight-details.html">Flight Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Payments</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html" data-bs-toggle="tooltip" title="Learn more about Badr Airlines, our history, and our mission.">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html" data-bs-toggle="tooltip" title="Get in touch with Badr Airlines for support and inquiries.">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="hero d-flex align-items-center">
        <div class="hero-content">
            <h1>More Flights, <br>More Adventures</h1>
        </div>
    </div>

    <div class="container booking-box mt-4">
        <form class="row g-3" id="bookingForm">

            <div class="col-md-6">
                <label for="passengerName" class="form-label">Passenger Name</label>
                <input type="text" class="form-control" id="passengerName" required>
            </div>

            <div class="col-md-6">
                <label for="from" class="form-label">From</label>
                <select class="form-select" id="from">
                    <option selected>-- Select City --</option>
                    <option value="khartoum">Khartoum</option>
                    <option value="juba">Juba</option>
                    <option value="cairo">Cairo</option>
                    <option value="nairobi">Nairobi</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="to" class="form-label">To</label>
                <select class="form-select" id="to">
                    <option selected>-- Select City --</option>
                    <option value="dubai">Dubai</option>
                    <option value="doha">Doha</option>
                    <option value="istanbul">Istanbul</option>
                    <option value="riyadh">Riyadh</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date">
            </div>
            <div class="col-md-4">
                <label for="children" class="form-label">Children</label>
                <select class="form-select" id="children">
                    <option value="0">0 Children</option>
                    <option value="1">1 Child</option>
                    <option value="2">2 Children</option>
                    <option value="3">3 Children</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="currency" class="form-label">Currency</label>
                <select class="form-select" id="currency">
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                </select>
            </div>


            <div class="col-12">
                <button type="submit" class="btn btn-light">Submit</button>
            </div>
        </form>
    </div>

    <div class="container mt-5">
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <div class="card">
                    <img src="https://badrairlines.com/images/city/addis-ababa.jpg" class="card-img-top" alt="Addis Ababa">
                    <div class="card-body text-center"><p>Addis Ababa</p></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="https://badrairlines.com/images/city/kano.jpg" class="card-img-top" alt="Kano">
                    <div class="card-body text-center"><p>Kano</p></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="https://badrairlines.com/images/city/juba.jpg" class="card-img-top" alt="Juba">
                    <div class="card-body text-center"><p>Juba</p></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="https://badrairlines.com/images/city/dubai.jpg" class="card-img-top" alt="Dubai">
                    <div class="card-body text-center"><p>Dubai</p></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="https://badrairlines.com/images/city/cairo.jpg" class="card-img-top" alt="Cairo">
                    <div class="card-body text-center"><p>Cairo</p></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5">
        <div class="container text-center">
            <div class="newsletter mb-4">
                <p>Get news and offers sent direct to your inbox</p>
                <div class="input-group justify-content-center">
                    <input type="email" class="form-control w-auto" placeholder="Enter your email address">
                    <button class="btn btn-light">Sign up</button>
                </div>
            </div>
            <img src="https://badrairlines.com/images/logo.png" alt="Badr Airlines Logo" height="40">
            <div class="row mt-4">
                <div class="col">
                    <a class="text-white d-block" href="#">Book</a>
                    <a class="text-white d-block" href="#">Destinations</a>
                    <a class="text-white d-block" href="#">Timetable</a>
                </div>
                <div class="col">
                    <p><strong>Timetable</strong></p>
                    <p>Cargo</p>
                </div>
                <div class="col">
                    <p><strong>About us</strong></p>
                    <p>Contact</p>
                </div>
                <div class="col">
                    <p><strong>Policies</strong></p>
                    <p>Terms and conditions</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    
    <script>
    // Redirect to login if not logged in
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'index.html';
    }
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });
        document.getElementById('bookingForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const data = {
                passengerName: document.getElementById('passengerName').value,
                from: document.getElementById('from').value,
                to: document.getElementById('to').value,
                date: document.getElementById('date').value,
                children: parseInt(document.getElementById('children').value),
                currency: document.getElementById('currency').value
            };

            // Store booking details
            localStorage.setItem('bookingDetails', JSON.stringify(data));

            // Redirect to flight details page
            window.location.href = 'flight-details.html';
        });

        document.getElementById('logoutLink').addEventListener('click', function (e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        });

    </script>
</body>
</html>
