<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Badr Airlines</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a285f 0%, #4e73df 100%);
            min-height: 100vh;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        .logo {
            display: block;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card p-4" style="width: 100%; max-width: 400px;">
            <img src="https://badrairlines.com/images/logo.png" alt="Badr Airlines Logo" height="50" class="logo">
            <h2 class="text-center mb-4">Login</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <span>Don't have an account? <a href="signup.html">Sign up</a></span>
            </div>
        </div>
    </div>
    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var savedEmail = localStorage.getItem('signupEmail');
        var savedPassword = localStorage.getItem('signupPassword');

        // Admin credentials
        if (email === 'admin@badrairlines.com' && password === 'admin123') {
            localStorage.setItem('isAdmin', 'true');
            window.location.href = 'admin-dashboard.html';
        }
        // Regular user credentials
        else if (
            (email === 'admin@example.com' && password === 'password123') ||
            (email === savedEmail && password === savedPassword)
        ) {
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'air.html';
        } else {
            alert('Invalid email or password.');
        }
    });
    </script>
</body>
</html> 

@section Scripts {
