<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft & Routes - Badr Airlines Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #0a285f 0%, #4e73df 100%);
            padding: 1rem;
        }
        .navbar-brand {
            color: rgb(72, 61, 185) !important;
            font-weight: bold;
        }
        .nav-link {
            color: #4e73df !important;
            background-color: white;
            border-radius: 5px;
            padding: 0.5rem 1rem !important;
            margin: 0 0.2rem;
        }
        .nav-link:hover {
            color: #2e59d9 !important;
            background-color: #f8f9fa;
        }
        .nav-link.active {
            color: #2e59d9 !important;
            font-weight: bold;
            background-color: #e9ecef;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="admin-dashboard.html">Badr Airlines Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-pricing.html">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-reports.html">Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin-aircraft.html">Aircraft & Routes</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <h2>Aircraft & Routes Management</h2>
            </div>
            <div class="col text-end">
                <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#addAircraftModal">
                    Add Aircraft
                </button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRouteModal">
                    Add Route
                </button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Aircraft Fleet</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Registration</th>
                                        <th>Type</th>
                                        <th>Capacity</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="aircraftTableBody">
                                    <!-- Aircraft will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Route Network</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Route ID</th>
                                        <th>Origin</th>
                                        <th>Destination</th>
                                        <th>Distance</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="routesTableBody">
                                    <!-- Routes will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Aircraft Modal -->
    <div class="modal fade" id="addAircraftModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Aircraft</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="aircraftForm">
                        <div class="mb-3">
                            <label class="form-label">Registration Number</label>
                            <input type="text" class="form-control" id="registration" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Aircraft Type</label>
                            <select class="form-select" id="aircraftType" required>
                                <option value="">Select Aircraft Type</option>
                                <option value="Boeing 737">Boeing 737</option>
                                <option value="Boeing 777">Boeing 777</option>
                                <option value="Airbus A320">Airbus A320</option>
                                <option value="Airbus A350">Airbus A350</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Passenger Capacity</label>
                            <input type="number" class="form-control" id="capacity" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="status" required>
                                <option value="Active">Active</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveAircraftBtn">Save Aircraft</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Route Modal -->
    <div class="modal fade" id="addRouteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Route</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="routeForm">
                        <div class="mb-3">
                            <label class="form-label">Origin</label>
                            <input type="text" class="form-control" id="origin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Destination</label>
                            <input type="text" class="form-control" id="destination" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Distance (km)</label>
                            <input type="number" class="form-control" id="distance" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estimated Flight Time (hours)</label>
                            <input type="number" class="form-control" id="flightTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Base Price</label>
                            <input type="number" class="form-control" id="basePrice" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveRouteBtn">Save Route</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in as admin
        if (!localStorage.getItem('isAdmin')) {
            window.location.href = 'index.html';
        }

        // Initialize data storage
        let aircraft = JSON.parse(localStorage.getItem('aircraft')) || [];
        let routes = JSON.parse(localStorage.getItem('routes')) || [];

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        });

        // Aircraft Management Functions
        function renderAircraft() {
            const tbody = document.getElementById('aircraftTableBody');
            tbody.innerHTML = '';
            
            aircraft.forEach((plane, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${plane.registration}</td>
                    <td>${plane.type}</td>
                    <td>${plane.capacity}</td>
                    <td>${plane.status}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editAircraft(${index})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteAircraft(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editAircraft(index) {
            const plane = aircraft[index];
            document.getElementById('registration').value = plane.registration;
            document.getElementById('aircraftType').value = plane.type;
            document.getElementById('capacity').value = plane.capacity;
            document.getElementById('status').value = plane.status;
            // Show modal and handle save
        }

        function deleteAircraft(index) {
            if (confirm('Are you sure you want to delete this aircraft?')) {
                aircraft.splice(index, 1);
                localStorage.setItem('aircraft', JSON.stringify(aircraft));
                renderAircraft();
            }
        }

        // Route Management Functions
        function renderRoutes() {
            const tbody = document.getElementById('routesTableBody');
            tbody.innerHTML = '';
            
            routes.forEach((route, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${route.id || 'R' + (index + 1)}</td>
                    <td>${route.origin}</td>
                    <td>${route.destination}</td>
                    <td>${route.distance} km</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editRoute(${index})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteRoute(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editRoute(index) {
            const route = routes[index];
            document.getElementById('origin').value = route.origin;
            document.getElementById('destination').value = route.destination;
            document.getElementById('distance').value = route.distance;
            document.getElementById('flightTime').value = route.flightTime;
            document.getElementById('basePrice').value = route.basePrice;
            // Show modal and handle save
        }

        function deleteRoute(index) {
            if (confirm('Are you sure you want to delete this route?')) {
                routes.splice(index, 1);
                localStorage.setItem('routes', JSON.stringify(routes));
                renderRoutes();
            }
        }

        // Event Listeners
        document.getElementById('saveAircraftBtn').addEventListener('click', function() {
            const plane = {
                registration: document.getElementById('registration').value,
                type: document.getElementById('aircraftType').value,
                capacity: document.getElementById('capacity').value,
                status: document.getElementById('status').value
            };

            aircraft.push(plane);
            localStorage.setItem('aircraft', JSON.stringify(aircraft));
            renderAircraft();
            bootstrap.Modal.getInstance(document.getElementById('addAircraftModal')).hide();
            document.getElementById('aircraftForm').reset();
        });

        document.getElementById('saveRouteBtn').addEventListener('click', function() {
            const route = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                distance: document.getElementById('distance').value,
                flightTime: document.getElementById('flightTime').value,
                basePrice: document.getElementById('basePrice').value
            };

            routes.push(route);
            localStorage.setItem('routes', JSON.stringify(routes));
            renderRoutes();
            bootstrap.Modal.getInstance(document.getElementById('addRouteModal')).hide();
            document.getElementById('routeForm').reset();
        });

        // Initialize components
        renderAircraft();
        renderRoutes();
    </script>
</body>
</html>
