<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing & Discounts - Badr Airlines Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #0a285f 0%, #4e73df 100%);
            padding: 1rem;
        }
        .navbar-brand {
            color: rgb(72, 61, 185) !important;
            font-weight: bold;
        }
        .nav-link {
            color: #4e73df !important;
            background-color: white;
            border-radius: 5px;
            padding: 0.5rem 1rem !important;
            margin: 0 0.2rem;
        }
        .nav-link:hover {
            color: #2e59d9 !important;
            background-color: #f8f9fa;
        }
        .nav-link.active {
            color: #2e59d9 !important;
            font-weight: bold;
            background-color: #e9ecef;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="admin-dashboard.html">Badr Airlines Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin-pricing.html">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-reports.html">Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-aircraft.html">Aircraft & Routes</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <h2>Pricing & Discounts Management</h2>
            </div>
            <div class="col text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDiscountModal">
                    Add New Discount
                </button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Base Pricing Rules</h5>
                        <form id="pricingForm">
                            <div class="mb-3">
                                <label class="form-label">Base Price Multiplier</label>
                                <input type="number" class="form-control" id="baseMultiplier" step="0.1" value="1.0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Peak Season Surcharge (%)</label>
                                <input type="number" class="form-control" id="peakSurcharge" value="20">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Weekend Surcharge (%)</label>
                                <input type="number" class="form-control" id="weekendSurcharge" value="15">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Last-Minute Booking Surcharge (%)</label>
                                <input type="number" class="form-control" id="lastMinuteSurcharge" value="25">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Pricing Rules</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Active Discounts</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Code</th>
                                        <th>Discount</th>
                                        <th>Valid Until</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="discountsTableBody">
                                    <!-- Discounts will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Discount Modal -->
    <div class="modal fade" id="addDiscountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Discount</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="discountForm">
                        <div class="mb-3">
                            <label class="form-label">Discount Code</label>
                            <input type="text" class="form-control" id="discountCode" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Discount Percentage</label>
                            <input type="number" class="form-control" id="discountPercentage" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Valid Until</label>
                            <input type="date" class="form-control" id="validUntil" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Minimum Purchase Amount</label>
                            <input type="number" class="form-control" id="minPurchase" value="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveDiscountBtn">Save Discount</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in as admin
        if (!localStorage.getItem('isAdmin')) {
            window.location.href = 'index.html';
        }

        // Initialize data storage
        let discounts = JSON.parse(localStorage.getItem('discounts')) || [];
        let pricingRules = JSON.parse(localStorage.getItem('pricingRules')) || {
            baseMultiplier: 1.0,
            peakSurcharge: 20,
            weekendSurcharge: 15,
            lastMinuteSurcharge: 25
        };

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        });

        // Discount Management Functions
        function renderDiscounts() {
            const tbody = document.getElementById('discountsTableBody');
            tbody.innerHTML = '';
            
            discounts.forEach((discount, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${discount.code}</td>
                    <td>${discount.percentage}%</td>
                    <td>${new Date(discount.validUntil).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteDiscount(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteDiscount(index) {
            if (confirm('Are you sure you want to delete this discount?')) {
                discounts.splice(index, 1);
                localStorage.setItem('discounts', JSON.stringify(discounts));
                renderDiscounts();
            }
        }

        // Event Listeners
        document.getElementById('saveDiscountBtn').addEventListener('click', function() {
            const discount = {
                code: document.getElementById('discountCode').value,
                percentage: document.getElementById('discountPercentage').value,
                validUntil: document.getElementById('validUntil').value,
                minPurchase: document.getElementById('minPurchase').value
            };

            discounts.push(discount);
            localStorage.setItem('discounts', JSON.stringify(discounts));
            renderDiscounts();
            bootstrap.Modal.getInstance(document.getElementById('addDiscountModal')).hide();
            document.getElementById('discountForm').reset();
        });

        document.getElementById('pricingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            pricingRules = {
                baseMultiplier: parseFloat(document.getElementById('baseMultiplier').value),
                peakSurcharge: parseFloat(document.getElementById('peakSurcharge').value),
                weekendSurcharge: parseFloat(document.getElementById('weekendSurcharge').value),
                lastMinuteSurcharge: parseFloat(document.getElementById('lastMinuteSurcharge').value)
            };
            localStorage.setItem('pricingRules', JSON.stringify(pricingRules));
            alert('Pricing rules updated successfully!');
        });

        // Initialize components
        renderDiscounts();
        
        // Load pricing rules
        document.getElementById('baseMultiplier').value = pricingRules.baseMultiplier;
        document.getElementById('peakSurcharge').value = pricingRules.peakSurcharge;
        document.getElementById('weekendSurcharge').value = pricingRules.weekendSurcharge;
        document.getElementById('lastMinuteSurcharge').value = pricingRules.lastMinuteSurcharge;
    </script>
</body>
</html>
