<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - Badr Airlines</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    bokingg

    <style>
        body {
            background: linear-gradient(135deg, #0a285f 0%, #4e73df 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .bookings-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            background: white;
        }

        .logo {
            display: block;
            margin: 0 auto 20px auto;
        }

        .booking-card {
            transition: transform 0.2s;
        }

            .booking-card:hover {
                transform: translateY(-5px);
            }

        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-confirmed {
            background-color: #28a745;
            color: white;
        }

        .status-pending {
            background-color: #ffc107;
            color: black;
        }

        .status-completed {
            background-color: #17a2b8;
            color: white;
        }
    </style>
</head>
<body>
    <div class="bookings-container">
        <img src="https://badrairlines.com/images/logo.png" alt="Badr Airlines Logo" height="50" class="logo">

        <div class="card">
            <div class="card-body">
                <h4 class="card-title mb-4">Your Bookings</h4>
                <div id="bookingsList">
                    <!-- Bookings will be loaded here -->
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>


    <script>
        // Check if user is logged in
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'index.html';
        }

        // Function to format date
        function formatDate(dateString) {
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Function to get status badge class
        function getStatusBadgeClass(status) {
            switch (status.toLowerCase()) {
                case 'confirmed':
                    return 'status-confirmed';
                case 'pending':
                    return 'status-pending';
                case 'completed':
                    return 'status-completed';
                default:
                    return '';
            }
        }

        // Function to load bookings
        async function loadBookings() {
            try {
                const response = await fetch('/Booking/GetAllBookings');
                if (!response.ok) {
                    throw new Error('Failed to load bookings');
                }

                const bookings = await response.json();
                const bookingsList = document.getElementById('bookingsList');

                if (bookings.length === 0) {
                    bookingsList.innerHTML = '<p class="text-center">No bookings found</p>';
                    return;
                }

                bookingsList.innerHTML = bookings.map(booking => `
                        <div class="card booking-card mb-3">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <h5 class="card-title">Booking #${booking.id}</h5>
                                        <p class="card-text">
                                            <strong>Route:</strong> ${booking.from} → ${booking.to}<br>
                                            <strong>Date:</strong> ${formatDate(booking.date)}<br>
                                            <strong>Passenger:</strong> ${booking.passengerName}<br>
                                            <strong>Flight:</strong> ${booking.flightNumber}<br>
                                            <strong>Class:</strong> ${booking.class}<br>
                                            <strong>Total Price:</strong> $${booking.totalPrice}
                                        </p>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <span class="status-badge ${getStatusBadgeClass(booking.status)}">
                                            ${booking.status}
                                        </span>
                                        ${booking.payments && booking.payments.length > 0 ? `
                                            <div class="mt-3">
                                                <small class="text-muted">
                                                    Payment Method: ${booking.payments[0].paymentMethod}<br>
                                                    Transaction ID: ${booking.payments[0].transactionId}
                                                </small>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
            } catch (error) {
                console.error('Error loading bookings:', error);
                document.getElementById('bookingsList').innerHTML = `
                        <div class="alert alert-danger">
                            Failed to load bookings. Please try again later.
                        </div>
                    `;
            }
        }

        // Load bookings when page loads
        document.addEventListener('DOMContentLoaded', loadBookings);
    </script>
</body>
</html>
