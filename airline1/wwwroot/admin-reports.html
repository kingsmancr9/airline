<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Badr Airlines Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #0a285f 0%, #4e73df 100%);
            padding: 1rem;
        }
        .navbar-brand {
            color: rgb(72, 61, 185) !important;
            font-weight: bold;
        }
        .nav-link {
            color: #4e73df !important;
            background-color: white;
            border-radius: 5px;
            padding: 0.5rem 1rem !important;
            margin: 0 0.2rem;
        }
        .nav-link:hover {
            color: #2e59d9 !important;
            background-color: #f8f9fa;
        }
        .nav-link.active {
            color: #2e59d9 !important;
            font-weight: bold;
            background-color: #e9ecef;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="admin-dashboard.html">Badr Airlines Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-pricing.html">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin-reports.html">Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-aircraft.html">Aircraft & Routes</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Reports & Analytics</h2>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Revenue Overview</h5>
                        <div class="chart-container">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Passenger Statistics</h5>
                        <div class="chart-container">
                            <canvas id="passengerChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Load Factor by Route</h5>
                        <div class="chart-container">
                            <canvas id="loadFactorChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Revenue by Route</h5>
                        <div class="chart-container">
                            <canvas id="routeRevenueChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Detailed Route Performance</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Route</th>
                                        <th>Total Passengers</th>
                                        <th>Revenue</th>
                                        <th>Load Factor</th>
                                        <th>Average Fare</th>
                                        <th>On-Time Performance</th>
                                    </tr>
                                </thead>
                                <tbody id="routePerformanceBody">
                                    <!-- Route performance will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in as admin
        if (!localStorage.getItem('isAdmin')) {
            window.location.href = 'index.html';
        }

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        });

        // Initialize Charts
        function initializeCharts() {
            // Revenue Chart
            const revenueCtx = document.getElementById('revenueChart').getContext('2d');
            new Chart(revenueCtx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Monthly Revenue',
                        data: [120000, 150000, 180000, 160000, 200000, 220000],
                        borderColor: '#4e73df',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Passenger Chart
            const passengerCtx = document.getElementById('passengerChart').getContext('2d');
            new Chart(passengerCtx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Passengers',
                        data: [1200, 1500, 1800, 1600, 2000, 2200],
                        backgroundColor: '#4e73df'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Load Factor Chart
            const loadFactorCtx = document.getElementById('loadFactorChart').getContext('2d');
            new Chart(loadFactorCtx, {
                type: 'bar',
                data: {
                    labels: ['Route 1', 'Route 2', 'Route 3', 'Route 4', 'Route 5'],
                    datasets: [{
                        label: 'Load Factor (%)',
                        data: [85, 92, 78, 88, 95],
                        backgroundColor: '#4e73df'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Route Revenue Chart
            const routeRevenueCtx = document.getElementById('routeRevenueChart').getContext('2d');
            new Chart(routeRevenueCtx, {
                type: 'pie',
                data: {
                    labels: ['Route 1', 'Route 2', 'Route 3', 'Route 4', 'Route 5'],
                    datasets: [{
                        data: [300000, 250000, 200000, 180000, 150000],
                        backgroundColor: [
                            '#4e73df',
                            '#1cc88a',
                            '#36b9cc',
                            '#f6c23e',
                            '#e74a3b'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Render Route Performance Table
        function renderRoutePerformance() {
            const tbody = document.getElementById('routePerformanceBody');
            tbody.innerHTML = '';

            const routes = [
                {
                    route: 'New York - London',
                    passengers: 2500,
                    revenue: 300000,
                    loadFactor: 85,
                    avgFare: 120,
                    onTime: 92
                },
                {
                    route: 'London - Paris',
                    passengers: 1800,
                    revenue: 250000,
                    loadFactor: 92,
                    avgFare: 139,
                    onTime: 95
                },
                {
                    route: 'Paris - Dubai',
                    passengers: 1500,
                    revenue: 200000,
                    loadFactor: 78,
                    avgFare: 133,
                    onTime: 88
                },
                {
                    route: 'Dubai - Singapore',
                    passengers: 1200,
                    revenue: 180000,
                    loadFactor: 88,
                    avgFare: 150,
                    onTime: 90
                },
                {
                    route: 'Singapore - Tokyo',
                    passengers: 1000,
                    revenue: 150000,
                    loadFactor: 95,
                    avgFare: 150,
                    onTime: 94
                }
            ];

            routes.forEach(route => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${route.route}</td>
                    <td>${route.passengers}</td>
                    <td>$${route.revenue.toLocaleString()}</td>
                    <td>${route.loadFactor}%</td>
                    <td>$${route.avgFare}</td>
                    <td>${route.onTime}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize all components
        initializeCharts();
        renderRoutePerformance();
    </script>
</body>
</html>
